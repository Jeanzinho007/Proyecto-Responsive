<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $("button").click(function(){
                $("button").prop("disabled", true);
                avanzarCarro();
            });
        });

        // 1) el carro avanza y se detiene antes del semaforo
        function avanzarCarro(){
            $(".lol").animate({left: '650px'}, 2000, prenderRoja);
        }

        // 2) se prende la luz roja
        function prenderRoja(){
            $(".lal").addClass("prendida");
            setTimeout(prenderAmarilla, 1500);
        }

        // se apaga la roja y se prende la amarilla
        function prenderAmarilla(){
            $(".lal").removeClass("prendida");
            $(".lel").addClass("prendida");
            setTimeout(prenderVerde, 1500);
        }

        // se apaga la amarilla y se prende la verde
        function prenderVerde(){
            $(".lel").removeClass("prendida");
            $(".lul").addClass("prendida");
            bajarCarro();
        }

        // 3) el carro baja un poco para no pasar encima del semaforo
        function bajarCarro(){
            $(".lol").animate({bottom: '-=20px'}, 400, seguirCamino);
        }

        // 4) sigue su camino como antes
        function seguirCamino(){
            $(".lol").animate({left: '1000px'}, 2000, reiniciar);
        }

        function reiniciar(){
            $(".lul").removeClass("prendida");
            $(".lol").css({left: '-150px', bottom: '14vh'});
            $("button").prop("disabled", false);
        }
    </script>
    <title>Carro</title>
</head>
<body>
    <button class="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24">
            <path d="m18 0 8 12 10-8-4 20H4L0 4l10 8 8-12z"></path>
        </svg>
        Arrancar
    </button>
    <div>
        <img class="lol" src="1.png" alt="img">
    </div>
    <div class="lil">
        <div class="lal"></div>
        <div class="lel"></div>
        <div class="lul"></div>
    </div>
</body>
</html>
